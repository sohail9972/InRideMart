spring:
  datasource:
    url: jdbc:h2:mem:customerdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    issuer: test-auth
    secret: test-secret-test-secret-test-secret-32bytes

logging:
  level:
    root: warn
    com.inridemart.customer: info
