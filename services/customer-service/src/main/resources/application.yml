server:
  port: 8082

spring:
  application:
    name: customer-service

  datasource:
    url: ${INRIDEMART_CUSTOMER_DB_URL:jdbc:postgresql://localhost:5433/inridemart_customer}
    username: ${INRIDEMART_DB_USERNAME:inridemart}
    password: ${INRIDEMART_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: ${INRIDEMART_JWT_ISSUER:inridemart-auth}
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
