server:
  port: 8083

spring:
  application:
    name: catalog-service
  datasource:
    url: ${INRIDEMART_CATALOG_DB_URL:jdbc:postgresql://localhost:5433/inridemart_catalog}
    username: ${INRIDEMART_DB_USERNAME:inridemart}
    password: ${INRIDEMART_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
